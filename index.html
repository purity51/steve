<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Stevie</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #090105;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            color: white;
            height: 100vh;
            width: 100vw;
        }

        /* 1. POPUP MODAL STYLING */
        #popup-overlay {
            position: fixed;
            inset: 0;
            background: rgba(9, 1, 5, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.8s ease;
        }
        .popup-box {
            background: #1a0510;
            border: 2px solid #ff4d88;
            box-shadow: 0 0 25px rgba(255, 77, 136, 0.5);
            padding: 40px 50px;
            border-radius: 16px;
            text-align: center;
            position: relative;
        }
        .popup-box h2 {
            font-size: 26px;
            margin-bottom: 30px;
            color: #ffb3cc;
            text-shadow: 0 0 8px #ff4d88;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 25px;
            position: relative;
            height: 45px;
        }
        button {
            padding: 10px 28px;
            font-size: 18px;
            font-family: inherit;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        #yes-btn {
            background: #ff4d88;
            color: white;
            box-shadow: 0 0 15px #ff4d88;
        }
        #yes-btn:hover {
            transform: scale(1.1);
        }
        #no-btn {
            background: #331122;
            color: #ff99bb;
            border: 1px solid #ff4d88;
            position: relative;
        }

        /* 2. TYPEWRITER TEXT AT TOP */
        #typewriter-container {
            position: absolute;
            top: 8%;
            width: 100%;
            text-align: center;
            z-index: 10;
            pointer-events: none;
            display: none;
        }
        #typewriter-text {
            font-size: 22px;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 0 10px #ff6699, 0 0 20px #ff3377;
            border-right: 2px solid #ff6699;
            padding-right: 5px;
            animation: blink 0.7s infinite;
        }
        @keyframes blink {
            50% { border-color: transparent; }
        }

        /* 3. THREE.JS CANVAS */
        #canvas-container {
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.5s ease;
        }
    </style>
    <!-- Load Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- Interactive Popup -->
    <div id="popup-overlay">
        <div class="popup-box">
            <h2>Do you like me? 💖</h2>
            <div class="btn-group">
                <button id="yes-btn">Yes</button>
                <button id="no-btn">No</button>
            </div>
        </div>
    </div>

    <!-- Continuous Typewriter Message -->
    <div id="typewriter-container">
        <span id="typewriter-text"></span>
    </div>

    <!-- 3D Scene Container -->
    <div id="canvas-container"></div>

    <script>
        // --- 1. POPUP LOGIC ("No" runs away, "Yes" opens the heart) ---
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        const popupOverlay = document.getElementById('popup-overlay');
        const canvasContainer = document.getElementById('canvas-container');
        const typewriterContainer = document.getElementById('typewriter-container');

        function moveNoButton() {
            const x = (Math.random() - 0.5) * 300;
            const y = (Math.random() - 0.5) * 200;
            noBtn.style.transform = `translate(${x}px, ${y}px)`;
        }

        // Make "No" dodge both mouse hover and mobile taps
        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveNoButton();
        });
        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        yesBtn.addEventListener('click', () => {
            popupOverlay.style.opacity = '0';
            setTimeout(() => {
                popupOverlay.style.display = 'none';
                canvasContainer.style.opacity = '1';
                typewriterContainer.style.display = 'block';
                startTypewriter();
            }, 800);
        });

        // --- 2. CONTINUOUS TYPEWRITER EFFECT ---
        const message = "this is for you, Stevie ✨";
        const textElement = document.getElementById('typewriter-text');
        let charIndex = 0;
        let isDeleting = false;

        function startTypewriter() {
            if (!isDeleting && charIndex <= message.length) {
                textElement.textContent = message.substring(0, charIndex);
                charIndex++;
                setTimeout(startTypewriter, 120);
            } else if (isDeleting && charIndex >= 0) {
                textElement.textContent = message.substring(0, charIndex);
                charIndex--;
                setTimeout(startTypewriter, 60);
            } else {
                isDeleting = !isDeleting;
                setTimeout(startTypewriter, isDeleting ? 2000 : 500);
            }
        }

        // --- 3. THREE.JS 3D OUTER PARTICLE HEART + INNER CRYSTAL HEART ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x090105, 0.025);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 26;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        canvasContainer.appendChild(renderer.domElement);

        // Heart parametric equation
        function heartPoint(t, scale = 1) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
            return new THREE.Vector2(x * scale, y * scale);
        }

        // A. INNER 3D FACETED CRYSTAL HEART
        const heartShape = new THREE.Shape();
        for (let i = 0; i <= 100; i++) {
            const t = (i / 100) * Math.PI * 2;
            const pt = heartPoint(t, 0.16);
            if (i === 0) heartShape.moveTo(pt.x, pt.y);
            else heartShape.lineTo(pt.x, pt.y);
        }

        const extrudeSettings = {
            depth: 1.2,
            bevelEnabled: true,
            bevelSegments: 2,
            steps: 1,
            bevelSize: 0.6,
            bevelThickness: 0.6
        };

        const innerGeo = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
        innerGeo.center();
        const innerMat = new THREE.MeshPhongMaterial({
            color: 0xff4d88,
            emissive: 0x440018,
            specular: 0xffffff,
            shininess: 100,
            flatShading: true, // Gives the faceted low-poly gem look from the video
            transparent: true,
            opacity: 0.9
        });
        const innerHeart = new THREE.Mesh(innerGeo, innerMat);
        scene.add(innerHeart);

        // Lights for the 3D crystal heart
        const pointLight1 = new THREE.PointLight(0xff80aa, 2, 50);
        pointLight1.position.set(10, 10, 15);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0xffffff, 1.5, 50);
        pointLight2.position.set(-10, -10, 10);
        scene.add(pointLight2);

        const ambientLight = new THREE.AmbientLight(0xff3366, 0.6);
        scene.add(ambientLight);

        // B. OUTER SPARKLING PARTICLE HEART (Matches the code in the video!)
        const count = 2500;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(count * 3);
        const colors = new Float32Array(count * 3);
        const randoms = new Float32Array(count);

        const colorChoices = [
            new THREE.Color(0xff4d88), // Hot pink
            new THREE.Color(0xff99bb), // Soft pink
            new THREE.Color(0xffffff), // Sparkle white
            new THREE.Color(0xd92662)  // Deep rose
        ];

        for (let i = 0; i < count; i++) {
            const phi = Math.random() * Math.PI * 2;
            const i3 = i * 3;
            randoms[i] = Math.random();

            const pt = heartPoint(phi, 0.68);
            // Add 3D thickness and scatter around the heart outline
            const spread = (Math.random() - 0.5) * 2.2;
            const zSpread = (Math.random() - 0.5) * 3.5;

            positions[i3] = pt.x + spread;
            positions[i3 + 1] = pt.y + spread + 1.5;
            positions[i3 + 2] = zSpread;

            const colorIndex = Math.floor(Math.random() * colorChoices.length);
            const color = colorChoices[colorIndex];
            colors[i3] = color.r;
            colors[i3 + 1] = color.g;
            colors[i3 + 2] = color.b;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        // Create a soft circular glow texture for particles
        const spriteCanvas = document.createElement('canvas');
        spriteCanvas.width = 32;
        spriteCanvas.height = 32;
        const ctx = spriteCanvas.getContext('2d');
        const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
        grad.addColorStop(0, 'rgba(255,255,255,1)');
        grad.addColorStop(0.4, 'rgba(255,150,190,0.8)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 32, 32);
        const particleTexture = new THREE.CanvasTexture(spriteCanvas);

        const particleMat = new THREE.PointsMaterial({
            size: 0.35,
            map: particleTexture,
            vertexColors: true,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const outerHeartParticles = new THREE.Points(geometry, particleMat);
        scene.add(outerHeartParticles);

        // C. FLOATING BACKGROUND DUST PARTICLES
        const bgCount = 600;
        const bgGeo = new THREE.BufferGeometry();
        const bgPos = new Float32Array(bgCount * 3);
        for (let i = 0; i < bgCount * 3; i++) {
            bgPos[i] = (Math.random() - 0.5) * 60;
        }
        bgGeo.setAttribute('position', new THREE.BufferAttribute(bgPos, 3));
        const bgMat = new THREE.PointsMaterial({
            size: 0.2,
            color: 0xff6699,
            transparent: true,
            opacity: 0.5
        });
        const bgParticles = new THREE.Points(bgGeo, bgMat);
        scene.add(bgParticles);

        // --- 4. ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Spin the inner crystal heart & give it a gentle heartbeat pulse
            innerHeart.rotation.y = elapsedTime * 1.2;
            const pulse = 1 + Math.sin(elapsedTime * 3) * 0.08;
            innerHeart.scale.set(pulse, pulse, pulse);

            // Gently rotate the outer particle heart
            outerHeartParticles.rotation.y = Math.sin(elapsedTime * 0.5) * 0.4;
            bgParticles.rotation.y = elapsedTime * 0.05;

            renderer.render(scene, camera);
        }

        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
